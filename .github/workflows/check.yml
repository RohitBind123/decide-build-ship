name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural checks for skills, manifests and eval cases
        run: python3 scripts/check_skills.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer CLI tests
        run: node --test cli/index.test.mjs cli/cleanup-slice.test.mjs cli/package.test.mjs
      - name: Package contents
        run: npm pack --dry-run
