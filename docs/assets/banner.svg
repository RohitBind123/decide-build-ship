<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Decide, Build, Ship</title>
  <desc id="desc">An idea becomes a spec, decisions, slices, verified builds and releases, in a loop the owner steers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <text x="64" y="118" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">Decide, Build, Ship</text>
  <text x="64" y="166" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Talk to Claude about your product. It writes the spec,</text>
  <text x="64" y="200" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">asks what only you can decide, and builds it to production grade.</text>
  <text x="64" y="252" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#94a3b8">discover · decide · plan · design · build · verify · ship · autopilot</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <path d="M934 88 A 92 92 0 0 1 1022 196" fill="none" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1000 236 A 92 92 0 0 1 868 236" fill="none" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M846 196 A 92 92 0 0 1 908 88" fill="none" stroke="#94a3b8" stroke-width="5" marker-end="url(#arrow)"/>
    <circle cx="934" cy="70" r="40" fill="#f59e0b"/>
    <text x="934" y="76" fill="#111827">Decide</text>
    <circle cx="1030" cy="226" r="40" fill="#3b82f6"/>
    <text x="1030" y="232" fill="#f8fafc">Build</text>
    <circle cx="838" cy="226" r="40" fill="#10b981"/>
    <text x="838" y="232" fill="#111827">Ship</text>
  </g>
</svg>
